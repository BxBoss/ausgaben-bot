<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ausgaben-Bot</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 2rem; background: #f5f6f8; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e6e6e6; }
    .card { background: #1e2126 !important; border-color: #2c3038 !important; }
    th { background: #23262c !important; }
    tr:nth-child(even) td { background: #1a1d22; }
    input, select { background: #14161a; color: #e6e6e6; border-color: #3a3f47 !important; }
    #dropzone { border-color: #3a3f47 !important; }
  }
  h1 { margin-top: 0; }
  .card {
    background: #fff; border: 1px solid #e2e4e8; border-radius: 10px;
    padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
  }
  #dropzone {
    border: 2px dashed #9aa0ab; border-radius: 10px; padding: 3rem 1rem;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #dropzone.dragover { border-color: #3b82f6; background: rgba(59,130,246,.08); }
  #dropzone p { margin: .25rem 0; opacity: .8; }
  #fileInput { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .5rem .6rem; border-bottom: 1px solid #e2e4e8; text-align: left; }
  th { background: #f0f1f3; position: sticky; top: 0; }
  input[type=text], input[type=number], select {
    width: 100%; box-sizing: border-box; padding: .3rem .4rem;
    border: 1px solid #cfd3d9; border-radius: 6px; font-size: .85rem;
  }
  .dup td { opacity: .5; }
  .actions { display: flex; gap: .75rem; align-items: center; margin-top: 1rem; }
  button {
    background: #2563eb; color: #fff; border: none; border-radius: 8px;
    padding: .6rem 1.1rem; font-size: .9rem; cursor: pointer;
  }
  button:disabled { background: #9aa0ab; cursor: not-allowed; }
  #status { font-size: .9rem; }
  .warn { color: #b45309; }
  .err { color: #dc2626; }
  .ok { color: #16a34a; }
  .table-wrap { max-height: 60vh; overflow: auto; }
</style>
</head>
<body>
  <h1>Ausgaben-Bot</h1>

  <div class="card">
    <div id="dropzone">
      <p><strong>Kontoauszug-PDF hierher ziehen</strong> oder klicken zum Auswaehlen</p>
      <p>Wird per KI in Transaktionen zerlegt und kategorisiert.</p>
    </div>
    <input type="file" id="fileInput" accept="application/pdf">
    <p id="uploadStatus"></p>
  </div>

  <div class="card" id="resultsCard" style="display:none;">
    <div class="table-wrap">
      <table id="resultsTable">
        <thead>
          <tr>
            <th style="width:2rem;">✓</th>
            <th>Datum</th>
            <th>Zahlungsempfaenger</th>
            <th>Verwendungszweck</th>
            <th>Betrag</th>
            <th>Typ</th>
            <th>Kategorie</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
    <div class="actions">
      <button id="commitBtn">Ins Google Sheet eintragen</button>
      <span id="status"></span>
    </div>
  </div>

  <script id="categories-data" type="application/json">{{ categories | tojson }}</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
